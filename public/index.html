<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F8F4ED'/%3E%3Cpath d='M16 16 L16 6 M16 16 L24.6 11 M16 16 L24.6 21 M16 16 L16 26 M16 16 L7.4 21 M16 16 L7.4 11' stroke='%23D97757' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <button class="new-chat-btn" onclick="newChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            New chat
        </button>

        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="m21 21-4.3-4.3"/>
            </svg>
            <input id="searchInput" type="text" placeholder="Search chats" autocomplete="off">
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-footer">
            <div class="sidebar-status">
                <span class="status-dot"></span>
                <span>Powered by opencode-go</span>
            </div>
        </div>

    </aside>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Main -->
    <main class="main">

        <header class="topbar">

            <button class="icon-btn hamburger" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>

            <div class="chat-title" id="chatTitle">New chat</div>

            <div class="topbar-actions">

                <button class="icon-btn" id="ttsBtn" onclick="toggleTts()" title="Toggle speech">
                    <svg id="ttsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                        <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
                    </svg>
                </button>

                <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
                    </svg>
                </button>

                <div class="user-badge" title="You">T</div>

            </div>

        </header>

        <div class="chat-scroll" id="chatScroll">

            <div class="chat-container">

                <div id="chatBox"></div>

                <div class="empty-state" id="emptyState">

                    <div class="empty-logo">
                        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <path d="M16 16 L16 6 M16 16 L24.6 11 M16 16 L24.6 21 M16 16 L16 26 M16 16 L7.4 21 M16 16 L7.4 11"/>
                        </svg>
                    </div>

                    <h1>What do you want to build?</h1>

                    <div class="chips">

                        <button class="chip" data-prompt="Brainstorm 5 startup ideas for a student with a small budget">
                            💡 Brainstorm startup ideas
                        </button>

                        <button class="chip" data-prompt="Explain quantum computing like I'm 10 years old">
                            ⚛️ Explain quantum computing simply
                        </button>

                        <button class="chip" data-prompt="Write a Python script that renames files in a folder">
                            🐍 Write a Python script
                        </button>

                        <button class="chip" data-prompt="Help me plan a 3-day budget trip to the mountains">
                            🏔️ Plan a budget trip
                        </button>

                        <button class="chip" data-prompt="Give me a weekly workout plan for beginners at home">
                            💪 Weekly workout plan
                        </button>

                        <button class="chip" data-prompt="Summarize the key ideas of The Psychology of Money">
                            📚 Book summary
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <div class="composer-wrap">

            <div class="composer" id="composer">

                <textarea id="message" rows="1" placeholder="Send a message"></textarea>

                <div class="composer-bottom">

                    <div class="composer-left">

                        <button class="icon-btn attach-btn" onclick="toast('Attachments coming soon')" title="Attach">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>

                        <div class="model-picker">
                            <select id="modelSelect" title="Model"></select>
                        </div>

                    </div>

                    <div class="composer-right">

                        <button class="icon-btn mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice input">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
                            </svg>
                        </button>

                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send (Enter)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 19V5M5 12l7-7 7 7"/>
                            </svg>
                        </button>

                        <button class="send-btn stop-btn" id="stopBtn" onclick="stopGeneration()" title="Stop generating (Esc)">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6.5" y="6.5" width="11" height="11" rx="2"/>
                            </svg>
                        </button>

                    </div>

                </div>

            </div>

            <div class="composer-hint">Nova can make mistakes. Please double-check responses.</div>

        </div>

    </main>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
